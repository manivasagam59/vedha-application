<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../static/login_style.css">
    <link rel="stylesheet" href="../static/boxicon/boxicons.min.css">
</head>

<body>

    <div class="toast error">
        <p>User name or password in valid</p>
        <span class="bx bx-x"></span>
    </div>

    <div class="my-form">

        <form action="" class="form-content">

            <h2>Sign in</h2>
            <input type="text" placeholder="User name" name="username">
            <input type="password" placeholder="Password" name="password">
            <label class="custom-dropdown" for="store-choose">
                <input id="store-choose" type="text" placeholder="Choose Store" name="store">
                <div class="arrow"></div>
                <div class="options-list">
                    <button class="option">Vedha stationary</button>
                </div>
            </label>

            <button>Sign in</button>

        </form>

        <div class="form-changer">
            <h2>Hi, Welcome</h2>
            <h3>Vedha Communications</h3>
            <p>Enter your user name and password to login into the store.</p>

            <a>Admin login</a>

        </div>

    </div>


</body>

</html>
